<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ELDENFIELD Ultimate Full System</title>
<style>
body{margin:0;padding:0;background:#0b0b0b;color:white;font-family:Arial, sans-serif;}
#mainScreen,#gameScreen{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.hidden{display:none;}
button{margin:5px;padding:10px 20px;font-size:16px;border-radius:8px;border:none;background:#444;color:white;cursor:pointer;}
button:hover{background:#666;}
input[type=text]{padding:5px;font-size:16px;border-radius:5px;border:1px solid #888;margin:5px;}
select{padding:5px;font-size:16px;margin:5px;}
#stats,#enemyPanel,#cards,#log{margin:10px;}
#stats, #enemyPanel{display:flex;gap:20px;font-weight:bold;font-size:18px;}
#cards{display:flex;flex-wrap:wrap;justify-content:center;margin-top:10px;}
.card{width:120px;height:160px;border:2px solid gold;border-radius:10px;margin:6px;padding:6px;background:#1a1a1a;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center;}
.card:hover{transform:scale(1.05);}
#log{height:200px;overflow:auto;border:1px solid gray;width:80%;background:#111;padding:5px;}
</style>
</head>
<body>

<div id="mainScreen">
<h1 style="font-size:48px;margin-bottom:20px;">⚔ ELDENFIELD ⚔</h1>
<div><label>Name: </label><input type="text" id="playerName" placeholder="Your Name"/></div>
<div><label>Class: </label>
<select id="playerClass">
<option value="warrior">Warrior</option><option value="knight">Knight</option><option value="soldier">Soldier</option>
<option value="thief">Thief</option><option value="astrologer">Astrologer</option><option value="prophet">Prophet</option>
<option value="samurai">Samurai</option><option value="prisoner">Prisoner</option><option value="miscreant">Miscreant</option>
<option value="vagrant">Vagrant</option>
</select></div>
<div style="margin-top:20px;">
<button onclick="startGameScreen()">Enter the World</button>
<button onclick="openSettings()">Settings</button>
</div>
</div>

<div id="gameScreen" class="hidden">
<div id="stats">
<span>HP: <span id="hp"></span></span>
<span>FP: <span id="fp"></span></span>
<span>Runes: <span id="runes"></span></span>
<span>Turn: <span id="turn"></span></span>
</div>

<div id="enemyPanel">
<span>Enemy: <span id="enemyName"></span></span>
<span>HP: <span id="enemyHP"></span></span>
</div>

<div id="cards"></div>
<div>
<button onclick="endTurn()">End Turn</button>
<button onclick="openShop()">Merchant</button>
<button onclick="upgradeWeapon()">Iji Weapon</button>
<button onclick="upgradeSpirit()">Roderika Spirit</button>
</div>
<div id="log"></div>
</div>

<script>
// ==== 설정 ====
function openSettings(){alert("Settings:\n- Language\n- Volume");}

// ==== 화면 전환 ====
function startGameScreen(){document.getElementById("mainScreen").classList.add("hidden");document.getElementById("gameScreen").classList.remove("hidden");initGame();}

// ==== 게임 상태 ====
let turn=1;
let player={
    hp:150, fp:100, runes:0,
    weaponLevel:1, spiritLevel:1,
    hand:[],spirit:null,
    status:{corruption:0,madness:0,death:0}, // 부패/발광/죽음
    flask:{red:7,blue:7}, // 성배병 14개
    moss:false // 이끼약
};
let enemy={name:"Enemy",hp:100,type:"enemy"};

// ==== 데이터 자동 생성 ====
const weapons=[],cards=[],bosses=[],spirits=[];
for(let i=1;i<=300;i++){weapons.push({name:"Weapon "+i,atk:5+Math.floor(Math.random()*20),type:["melee","ranged","magic"][Math.floor(Math.random()*3)]});}
for(let i=1;i<=200;i++){cards.push({name:"Card "+i,type:["attack","heal","fp","spirit","buff"][Math.floor(Math.random()*5)],value:10+Math.floor(Math.random()*40)});}
for(let i=1;i<=50;i++){spirits.push({name:"Spirit "+i,damage:10+Math.floor(Math.random()*30)});}
for(let i=1;i<=120;i++){
  let tier=i>100?"god":i>60?"demigod":"enemy";
  bosses.push({name:"Boss "+i,hp:100+Math.floor(Math.random()*500),drop:"Weapon "+(Math.floor(Math.random()*300)+1),tier:tier});
}

// ==== 로그 ====
function log(t){let box=document.getElementById("log");box.innerHTML+=t+"<br>";box.scrollTop=box.scrollHeight;}

// ==== UI 업데이트 ====
function updateUI(){
document.getElementById("hp").innerText=player.hp;
document.getElementById("fp").innerText=player.fp;
document.getElementById("runes").innerText=player.runes;
document.getElementById("turn").innerText=turn;
document.getElementById("enemyName").innerText=enemy.name;
document.getElementById("enemyHP").innerText=enemy.hp;
renderCards();
}

// ==== 카드 처리 ====
function drawCards(n){for(let i=0;i<n;i++){if(player.hand.length>=10) return; let card=cards[Math.floor(Math.random()*cards.length)]; player.hand.push(card);}}
function renderCards(){let area=document.getElementById("cards");area.innerHTML=""; player.hand.forEach((c,i)=>{let div=document.createElement("div"); div.className="card"; div.innerHTML=c.name; div.onclick=function(){useCard(i);}; area.appendChild(div);});}
function useCard(i){
  let c=player.hand[i];
  if(player.moss){log("Used moss. Turn skipped.");player.moss=false;player.hand.splice(i,1);updateUI();return;}
  switch(c.type){
    case"attack":attack(c.value);break;
    case"heal":player.hp+=c.value;log("Heal "+c.value);break;
    case"fp":player.fp+=c.value;log("FP +"+c.value);break;
    case"spirit":player.spirit=c;log("Spirit summoned");break;
    case"buff":player.weaponLevel+=1;log("Weapon Buff");break;
  }
  player.hand.splice(i,1);updateUI();
}

// ==== 전투 ====
function attack(d){
  d+=player.weaponLevel*5;
  enemy.hp-=d;
  log("Attack "+d);
  if(player.spirit){let dmg=player.spirit.value+player.spiritLevel*5;enemy.hp-=dmg;log("Spirit attack "+dmg);player.spirit=null;}
  if(enemy.hp<=0)winBattle();
  updateUI();
}
function enemyAttack(){
  let dmg=Math.floor(Math.random()*20)+5;
  player.hp-=dmg;log(enemy.name+" hits "+dmg);
  // 상태이상 턴 피해
  if(player.status.corruption>0){player.hp-=5;log("Corruption damage 5");}
  if(player.status.madness>0){player.fp-=5;log("Madness FP 5");}
  if(player.status.death>0){player.hp-=10;log("Death effect +10 dmg");}
  if(player.hp<=0){log("YOU DIED");player.hp=150;player.runes=0;}
}

// ==== 승리/보스 ====
function winBattle(){log(enemy.name+" defeated");player.runes+=100;consumeFlask();spawnEnemy();}
function spawnEnemy(){if(turn%10===0){spawnBoss();return;}enemy={name:"Enemy "+Math.floor(Math.random()*100),hp:120+turn*5,type:"enemy"};}
function spawnBoss(){let b=bosses[Math.floor(Math.random()*bosses.length)];enemy={name:b.name,hp:b.hp,type:b.tier,drop:b.drop};log("Boss Appears: "+b.name);if(b.tier==="god"){log("God Boss! All players must cooperate!");}}

// ==== 성배병 회복 ====
function consumeFlask(){if(player.flask.red>0){player.hp+=10;player.flask.red--;log("Red Flask heal 10");}if(player.flask.blue>0){player.fp+=5;player.flask.blue--;log("Blue Flask FP 5");}}

// ==== 턴 ====
function endTurn(){enemyAttack();turn++;drawCards(1);spawnEnemy();updateUI();}

// ==== 상점/강화 ====
function openShop(){let r=prompt("1: Flask upgrade 100 runes\n2: Spirit buy 150 runes");if(r==1&&player.runes>=100){player.hp+=20;player.runes-=100;log("HP increased");}if(r==2&&player.runes>=150){player.spirit={name:"Wolf",damage:15};player.runes-=150;log("Spirit obtained");}updateUI();}
function upgradeWeapon(){if(player.runes>=200){player.weaponLevel++;player.runes-=200;log("Weapon upgraded");updateUI();}}
function upgradeSpirit(){if(player.runes>=200){player.spiritLevel++;player.runes-=200;log("Spirit upgraded");updateUI();}}

// ==== 게임 시작 ====
function initGame(){drawCards(10);updateUI();log("Game Start");}
</script>
</body>
</html>
